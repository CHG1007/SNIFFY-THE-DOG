stages: [test, deploy]

backend_test:
  stage: test
  image: gradle:8.7-jdk21
  script:
    - cd back
    - chmod +x gradlew
    - ./gradlew test
  only:
    - develop

docker_build_check:
  stage: test
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - set -e
    - docker version
    - docker build -t backend:ci -f back/Dockerfile back
    - docker build -t nginx:ci -f nginx/Dockerfile .
  only:
    - develop

deploy_develop:
  stage: deploy
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    - apk add --no-cache openssh-client rsync bash coreutils gettext
    - mkdir -p ~/.ssh
    - printf "%s" "$DEPLOY_KEY64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      set -euo pipefail

      rm -rf dist && mkdir -p dist

      docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -f back/Dockerfile back
      docker save "$BACKEND_IMAGE:$IMAGE_TAG" -o "dist/backend_${IMAGE_TAG}.tar"

      docker build -t "$NGINX_IMAGE:$IMAGE_TAG" -f nginx/Dockerfile .
      docker save "$NGINX_IMAGE:$IMAGE_TAG" -o "dist/nginx_${IMAGE_TAG}.tar"

      cp docker-compose.yml dist/docker-compose.yml
      export SERVER_NAME="$SERVER_NAME"
      envsubst '${SERVER_NAME}' < nginx/nginx.conf > dist/nginx.conf

      cat > dist/.env << EOF
      BACKEND_IMAGE=$BACKEND_IMAGE
      NGINX_IMAGE=$NGINX_IMAGE
      IMAGE_TAG=$IMAGE_TAG
      MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE=$MYSQL_DATABASE
      MYSQL_USER=$MYSQL_USER
      MYSQL_PASSWORD=$MYSQL_PASSWORD
      EOF

      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      rsync -avz -e "ssh -i ~/.ssh/id_rsa" \
        dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "
        cd '$DEPLOY_PATH'
        docker load -i backend_${IMAGE_TAG}.tar
        docker load -i nginx_${IMAGE_TAG}.tar
        docker compose up -d --no-recreate mysql redis
        docker rm -f backend nginx 2>/dev/null || true
        docker compose up -d --no-deps backend nginx
        docker image prune -f
      "

  needs:
    - backend_test
    - docker_build_check

  only:
    - develop

  tags:
    - ssafy-ec2-runner
