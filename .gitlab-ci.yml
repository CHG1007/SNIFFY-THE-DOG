stages: [test, build, deploy]

backend_test:
  stage: test
  image: gradle:8.7-jdk21
  script:
    - cd back
    - chmod +x gradlew
    - ./gradlew test
  only:
    - develop

frontend_build:
  stage: build
  image: node:20-alpine
  variables:
    VITE_KAKAO_JS_KEY: $KAKAO_JS_KEY
  script:
    - cd front
    - npm ci
    - npm run build
  artifacts:
    paths:
      - front/dist/
    expire_in: 1 hour
  only:
    - develop

docker_build_check:
  stage: build
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - set -e
    - docker version
    - docker build -t backend:ci -f back/Dockerfile back
    - docker build -t nginx:ci -f nginx/Dockerfile nginx
  only:
    - develop

deploy_develop:
  stage: deploy
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    - apk add --no-cache openssh-client rsync bash coreutils gettext
    - mkdir -p ~/.ssh
    - printf "%s" "$DEPLOY_KEY64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      set -euo pipefail

      rm -rf deploy && mkdir -p deploy

      # Backend 이미지 빌드
      docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -f back/Dockerfile back
      docker save "$BACKEND_IMAGE:$IMAGE_TAG" -o "deploy/backend_${IMAGE_TAG}.tar"

      # Nginx 이미지 빌드
      docker build -t "$NGINX_IMAGE:$IMAGE_TAG" -f nginx/Dockerfile nginx
      docker save "$NGINX_IMAGE:$IMAGE_TAG" -o "deploy/nginx_${IMAGE_TAG}.tar"

      # Frontend 빌드 산출물 복사 (artifacts에서 가져옴)
      cp -r front/dist deploy/frontend

      # 설정 파일 복사
      cp docker-compose.yml deploy/docker-compose.yml
      export SERVER_NAME="$SERVER_NAME"
      envsubst '${SERVER_NAME}' < nginx/nginx.conf > deploy/nginx.conf

      cat > deploy/.env << EOF
      BACKEND_IMAGE=$BACKEND_IMAGE
      NGINX_IMAGE=$NGINX_IMAGE
      IMAGE_TAG=$IMAGE_TAG
      MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE=$MYSQL_DATABASE
      MYSQL_USER=$MYSQL_USER
      MYSQL_PASSWORD=$MYSQL_PASSWORD
      KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY
      KAKAO_JS_KEY=$KAKAO_JS_KEY
      JWT_SECRET=$JWT_SECRET
      GMS_API_KEY=$GMS_API_KEY
      OPENVIDU_SECRET=$OPENVIDU_SECRET
      SERVER_NAME=$SERVER_NAME
      EOF

      # 서버에 배포
      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      rsync -avz -e "ssh -i ~/.ssh/id_rsa" \
        deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "
        cd '$DEPLOY_PATH'
        docker load -i backend_${IMAGE_TAG}.tar
        docker load -i nginx_${IMAGE_TAG}.tar
        docker compose up -d --no-recreate mysql redis openvidu
        docker rm -f backend nginx 2>/dev/null || true
        docker compose up -d --no-deps backend nginx
        docker image prune -f
        rm -f backend_${IMAGE_TAG}.tar nginx_${IMAGE_TAG}.tar
      "

  needs:
    - backend_test
    - frontend_build
    - docker_build_check

  only:
    - develop

  tags:
    - ssafy-ec2-runner
