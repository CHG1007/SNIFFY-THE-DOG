stages: [test, build, deploy]

# ===================
# CI: 빌드 검증 (MR + develop)
# ===================

backend_test:
  stage: test
  image: gradle:8.7-jdk21
  script:
    - cd back
    - chmod +x gradlew
    - ./gradlew test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

frontend_build:
  stage: build
  image: node:20-alpine
  variables:
    VITE_KAKAO_JS_KEY: $KAKAO_JS_KEY
  script:
    - cd front
    - npm ci
    - npm run build
  artifacts:
    paths:
      - front/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

docker_build_check:
  stage: build
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - set -e
    - docker version
    - docker build -t backend:ci -f back/Dockerfile back
    - docker build -t nginx:ci -f nginx/Dockerfile nginx
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

# ===================
# CD: 배포 (develop only)
# ===================

deploy_develop:
  stage: deploy
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

  before_script:
    - apk add --no-cache openssh-client rsync bash coreutils gettext
    - mkdir -p ~/.ssh
    - printf "%s" "$DEPLOY_KEY64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      set -euo pipefail

      rm -rf deploy && mkdir -p deploy

      # Backend 이미지 빌드
      docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -f back/Dockerfile back
      docker save "$BACKEND_IMAGE:$IMAGE_TAG" -o "deploy/backend_${IMAGE_TAG}.tar"

      # Nginx 이미지 빌드
      docker build -t "$NGINX_IMAGE:$IMAGE_TAG" -f nginx/Dockerfile nginx
      docker save "$NGINX_IMAGE:$IMAGE_TAG" -o "deploy/nginx_${IMAGE_TAG}.tar"

      # Frontend 빌드 산출물 복사 (artifacts에서 가져옴)
      cp -r front/dist deploy/frontend

      # 설정 파일 복사
      cp docker-compose.yml deploy/docker-compose.yml
      export SERVER_NAME="$SERVER_NAME"
      envsubst '${SERVER_NAME}' < nginx/nginx.conf > deploy/nginx.conf

      # LiveKit 설정 파일 복사
      export LIVEKIT_API_KEY="$LIVEKIT_API_KEY"
      export LIVEKIT_API_SECRET="$LIVEKIT_API_SECRET"
      envsubst '${LIVEKIT_API_KEY} ${LIVEKIT_API_SECRET}' < livekit.yaml > deploy/livekit.yaml

      cat > deploy/.env << EOF
      BACKEND_IMAGE=$BACKEND_IMAGE
      NGINX_IMAGE=$NGINX_IMAGE
      IMAGE_TAG=$IMAGE_TAG
      MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE=$MYSQL_DATABASE
      MYSQL_USER=$MYSQL_USER
      MYSQL_PASSWORD=$MYSQL_PASSWORD
      MONGO_USER=$MONGO_USER
      MONGO_PASSWORD=$MONGO_PASSWORD
      MONGO_DATABASE=$MONGO_DATABASE
      KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY
      KAKAO_JS_KEY=$KAKAO_JS_KEY
      JWT_SECRET=$JWT_SECRET
      GMS_API_KEY=$GMS_API_KEY
      LIVEKIT_API_KEY=$LIVEKIT_API_KEY
      LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET
      SERVER_NAME=$SERVER_NAME
      EOF

      # 서버에 배포
      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      rsync -avz -e "ssh -i ~/.ssh/id_rsa" \
        deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "
        cd '$DEPLOY_PATH'
        docker load -i backend_${IMAGE_TAG}.tar
        docker load -i nginx_${IMAGE_TAG}.tar
        docker compose up -d --no-recreate mysql redis mongodb
        docker rm -f backend nginx livekit 2>/dev/null || true
        docker compose up -d --no-deps backend nginx livekit
        docker image prune -f
        rm -f *.tar

        # 컨테이너 health check (30초 대기)
        echo 'Waiting for backend to be healthy...'
        for i in \$(seq 1 30); do
          if docker ps --filter 'name=backend' --filter 'status=running' | grep -q backend; then
            echo 'Backend is running, checking health...'
            sleep 5
            if docker ps --filter 'name=backend' --filter 'status=running' | grep -q backend; then
              echo 'Backend health check passed!'
              exit 0
            fi
          fi
          echo \"Attempt \$i/30: Backend not ready yet...\"
          sleep 1
        done
        echo 'Backend failed to start!'
        docker logs backend --tail 50
        exit 1
      "

  needs:
    - backend_test
    - frontend_build
    - docker_build_check

  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

  tags:
    - ssafy-ec2-runner
