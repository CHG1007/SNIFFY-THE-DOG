stages: [test, build, deploy]

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  DOCKER_BUILDKIT: "1"

# ===================
# CI: 빌드 검증 (MR + develop)
# ===================

backend_test:
  stage: test
  image: gradle:8.7-jdk21
  cache:
    key: gradle-${CI_COMMIT_REF_SLUG}
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push
  script:
    - cd back
    - chmod +x gradlew
    - ./gradlew test --build-cache --parallel
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

frontend_build:
  stage: build
  image: node:20-alpine
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - front/node_modules
    policy: pull-push
  variables:
    VITE_KAKAO_JS_KEY: $KAKAO_JS_KEY
  script:
    - cd front
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - front/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

# MR에서는 Dockerfile 문법 검사만 (빠름)
docker_lint:
  stage: build
  image: hadolint/hadolint:latest-alpine
  script:
    - hadolint back/Dockerfile || true
    - hadolint nginx/Dockerfile || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ===================
# CD: 배포 (develop only)
# ===================

deploy_develop:
  stage: deploy
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    BACKEND_IMAGE: "$DOCKER_USERNAME/a407_back"
    NGINX_IMAGE: "$DOCKER_USERNAME/a407_nginx"

  before_script:
    - apk add --no-cache openssh-client bash coreutils gettext
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - mkdir -p ~/.ssh
    - printf "%s" "$DEPLOY_KEY64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      set -euo pipefail

      # Backend 이미지 빌드 & 푸시 (병렬)
      docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -t "$BACKEND_IMAGE:latest" -f back/Dockerfile back &
      BACKEND_PID=$!

      # Nginx 이미지 빌드 & 푸시 (병렬)
      docker build -t "$NGINX_IMAGE:$IMAGE_TAG" -t "$NGINX_IMAGE:latest" -f nginx/Dockerfile nginx &
      NGINX_PID=$!

      # 빌드 완료 대기
      wait $BACKEND_PID
      wait $NGINX_PID

      # Docker Hub에 푸시 (병렬)
      docker push "$BACKEND_IMAGE:$IMAGE_TAG" &
      docker push "$BACKEND_IMAGE:latest" &
      docker push "$NGINX_IMAGE:$IMAGE_TAG" &
      docker push "$NGINX_IMAGE:latest" &
      wait

      echo "Images pushed to Docker Hub successfully"

      # 설정 파일 준비
      rm -rf deploy && mkdir -p deploy

      # Frontend 빌드 산출물 복사
      cp -r front/dist deploy/frontend

      # 설정 파일 복사
      cp docker-compose.yml deploy/docker-compose.yml
      export SERVER_NAME="$SERVER_NAME"
      envsubst '${SERVER_NAME}' < nginx/nginx.conf > deploy/nginx.conf

      # LiveKit 설정 파일 복사
      export LIVEKIT_API_KEY="$LIVEKIT_API_KEY"
      export LIVEKIT_API_SECRET="$LIVEKIT_API_SECRET"
      envsubst '${LIVEKIT_API_KEY} ${LIVEKIT_API_SECRET}' < livekit.yaml > deploy/livekit.yaml

      cat > deploy/.env << EOF
      BACKEND_IMAGE=$BACKEND_IMAGE
      NGINX_IMAGE=$NGINX_IMAGE
      IMAGE_TAG=$IMAGE_TAG
      MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      MYSQL_DATABASE=$MYSQL_DATABASE
      MYSQL_USER=$MYSQL_USER
      MYSQL_PASSWORD=$MYSQL_PASSWORD
      MONGO_USER=$MONGO_USER
      MONGO_PASSWORD=$MONGO_PASSWORD
      MONGO_DATABASE=$MONGO_DATABASE
      KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY
      KAKAO_JS_KEY=$KAKAO_JS_KEY
      JWT_SECRET=$JWT_SECRET
      GMS_API_KEY=$GMS_API_KEY
      LIVEKIT_API_KEY=$LIVEKIT_API_KEY
      LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET
      SERVER_NAME=$SERVER_NAME
      EOF

      # 서버에 설정 파일만 전송 (이미지는 pull)
      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      scp -i ~/.ssh/id_rsa -r deploy/* "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # 서버에서 이미지 pull & 배포
      ssh -i ~/.ssh/id_rsa "$DEPLOY_USER@$DEPLOY_HOST" "
        cd '$DEPLOY_PATH'

        # Docker Hub 로그인
        echo '$DOCKER_PASSWORD' | docker login -u '$DOCKER_USERNAME' --password-stdin

        # 이미지 pull (병렬)
        docker pull '$BACKEND_IMAGE:$IMAGE_TAG' &
        docker pull '$NGINX_IMAGE:$IMAGE_TAG' &
        wait

        # DB 컨테이너 유지, 앱 컨테이너만 재시작
        docker compose up -d --no-recreate mysql redis mongodb
        docker rm -f backend nginx livekit 2>/dev/null || true
        docker compose up -d --no-deps backend nginx livekit
        docker image prune -f

        # Health check: healthy 상태 + crash loop 감지
        echo 'Waiting for backend to be healthy...'

        INITIAL_RESTART_COUNT=\$(docker inspect backend --format='{{.RestartCount}}' 2>/dev/null || echo '0')
        HEALTHY_COUNT=0

        for i in \$(seq 1 60); do
          # 현재 상태 확인
          HEALTH=\$(docker inspect backend --format='{{.State.Health.Status}}' 2>/dev/null || echo 'unknown')
          RESTART_COUNT=\$(docker inspect backend --format='{{.RestartCount}}' 2>/dev/null || echo '0')

          # Crash loop 감지: restart count가 증가하면 실패
          if [ \"\$RESTART_COUNT\" -gt \"\$INITIAL_RESTART_COUNT\" ]; then
            echo 'Backend is crash looping! RestartCount: '\$RESTART_COUNT
            docker logs backend --tail 100
            exit 1
          fi

          # Healthy 상태 확인
          if [ \"\$HEALTH\" = 'healthy' ]; then
            HEALTHY_COUNT=\$((HEALTHY_COUNT + 1))
            echo \"Backend healthy (\$HEALTHY_COUNT/3)...\"

            # 3번 연속 healthy면 성공 (30초간 안정)
            if [ \$HEALTHY_COUNT -ge 3 ]; then
              echo 'Backend health check passed!'
              exit 0
            fi
          else
            HEALTHY_COUNT=0
            echo \"Attempt \$i/60: status=\$HEALTH\"
          fi

          sleep 10
        done

        echo 'Backend failed to become healthy!'
        docker logs backend --tail 100
        exit 1
      "

  needs:
    - backend_test
    - frontend_build

  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

  tags:
    - ssafy-ec2-runner
