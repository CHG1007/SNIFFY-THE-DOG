services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet
    expose:
      - "3306"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - appnet
    expose:
      - "6379"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks:
      - appnet
    expose:
      - "27017"
    restart: unless-stopped

  backend:
    image: "${BACKEND_IMAGE}:${IMAGE_TAG}"
    container_name: backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}


      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_JS_KEY: ${KAKAO_JS_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GMS_API_KEY: ${GMS_API_KEY}

      SPRING_DATA_REDIS_HOST: redis
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      OPENVIDU_URL: http://openvidu:4443
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}
    depends_on:
      - mysql
      - redis
      - mongodb
      - openvidu
    networks:
      - appnet
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: "${NGINX_IMAGE}:${IMAGE_TAG}"
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - appnet
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - appnet
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

  openvidu:
    image: openvidu/openvidu-dev:2.30.0
    container_name: openvidu
    environment:
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}
      DOMAIN_OR_PUBLIC_IP: ${SERVER_NAME}
      HTTPS_PORT: 443
    expose:
      - "4443"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "40000-40100:40000-40100/udp"
    networks:
      - appnet

networks:
  appnet:

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  certbot_www:
  certbot_conf:
