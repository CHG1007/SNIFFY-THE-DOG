services:
  backend:
    image: "${BACKEND_IMAGE}:${IMAGE_TAG}"
    container_name: backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - appnet
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: "${NGINX_IMAGE}:${IMAGE_TAG}"
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
