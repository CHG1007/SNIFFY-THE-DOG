backend_test:
  stage: test
  image: gradle:8.14-jdk21
  script:
    - cd back
    - gradle test
  only:
    - develop
  tags:
    - ssafy-ec2-runner

frontend_build:
  stage: build
  image: node:20.19-alpine
  script:
    - cd front
    - npm ci
    - npm run build
  only:
    - develop
  tags:
    - ssafy-ec2-runner
