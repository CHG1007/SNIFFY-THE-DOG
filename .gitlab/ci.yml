# .gitlab/ci.yml

# 백엔드 소스 코드 실행합니다!!
backend_test:
  stage: test
  image: gradle:8.7-jdk17
  script:
    - cd back
    - chmod +x gradlew
    - ./gradlew test
  only:
    - develop

frontend_build:
  stage: build
  image: node:20
  script:
    - cd front
    - npm ci
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - front/dist
  only:
    - develop

build_images:
  stage: build
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  script:
    - |
      set -e
      docker version
      mkdir -p dist

      echo "Build backend: $BACKEND_IMAGE:$IMAGE_TAG"
      docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -f back/Dockerfile back
      docker save "$BACKEND_IMAGE:$IMAGE_TAG" -o "dist/backend_${IMAGE_TAG}.tar"

      echo "Build nginx: $NGINX_IMAGE:$IMAGE_TAG"
      docker build -t "$NGINX_IMAGE:$IMAGE_TAG" -f nginx/Dockerfile .
      docker save "$NGINX_IMAGE:$IMAGE_TAG" -o "dist/nginx_${IMAGE_TAG}.tar"

      cp docker-compose.yml dist/docker-compose.yml
      cp nginx/nginx.conf dist/nginx.conf

      ls -al dist
  artifacts:
    expire_in: 1 day
    paths:
      - dist/
  only:
    - develop
