deploy_develop:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - printf "%s" "$DEPLOY_KEY" | tr -d '\r' | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - head -n 1 ~/.ssh/id_ed25519  # 디버그: BEGIN OPENSSH PRIVATE KEY 떠야 정상
  script:
    - |
      test -n "$DEPLOY_PATH"
      ssh -i ~/.ssh/id_ed25519 \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        cd '$DEPLOY_PATH'
        git fetch --all
        git checkout develop
        git reset --hard origin/develop
        docker compose up -d --build
      "
  only:
    - develop
  needs:
    - backend_test
    - frontend_build
  tags:
    - ssafy-ec2-runner
