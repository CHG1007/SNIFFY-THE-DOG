deploy_develop:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - printf "%s" "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      set -e
      echo "SSH TARGET: $DEPLOY_USER@$DEPLOY_HOST"
      echo "DEPLOY_PATH: $DEPLOY_PATH"
      echo "BACKEND_IMAGE: $BACKEND_IMAGE  TAG: $IMAGE_TAG"
      echo "NGINX_IMAGE: $NGINX_IMAGE    TAG: $IMAGE_TAG"
      
      ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      
      ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        cd '$DEPLOY_PATH'

        docker load -i backend_${IMAGE_TAG}.tar
        docker load -i nginx_${IMAGE_TAG}.tar

        export BACKEND_IMAGE='$BACKEND_IMAGE'
        export NGINX_IMAGE='$NGINX_IMAGE'
        export IMAGE_TAG='$IMAGE_TAG'
        docker-compose -f docker-compose.yml up -d

        docker image prune -f
      "

  only:
    - develop

  needs:
    - job: build_images
      artifacts: true
    - job: backend_test
    - job: frontend_build

  tags:
    - ssafy-ec2-runner
