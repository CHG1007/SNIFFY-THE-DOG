spring:
  application:
    name: bootstrap
  profiles:
    include: rdb, livekit, mongo
  config:
    import: optional:classpath:/application-gms.yml

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 1209600


server:
  servlet:
    context-path: /api


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true


